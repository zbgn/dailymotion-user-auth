name: Dailymotion Actions
on: [ push, pull_request ]


jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Set up Python 3.12
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.14'
      - name: Set up uv
        uses: astral-sh/setup-uv@v7.6.0
      - name: Install lint dependencies
        run: uv sync --group dev --group test
      - name: Ruff check backend
        run: uv run ruff check .
      - name: Ruff format backend
        run: uv run ruff format --check .
      - name: Ty check
        run: uv run ty check .

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Set up Python 3.12
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.14'
      - name: Set up uv
        uses: astral-sh/setup-uv@v7.6.0
      - name: Install test dependencies
        run: uv sync --group test
      - name: Run unit tests
        run: uv run pytest tests/unit

  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: dbname
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d dbname"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/dbname
      SMTP_SERVER: localhost
      SMTP_PORT: 1025
      TZ: UTC
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Set up Python 3.12
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.14'
      - name: Set up uv
        uses: astral-sh/setup-uv@v7.6.0
      - name: Install test dependencies
        run: uv sync --group test
      - name: Initialize integration database schema
        run: |
          uv run python - <<'PY'
          from pathlib import Path

          import psycopg

          sql = Path("postgres-entrypoint-initdb.d/001_init_db.sql").read_text(encoding="utf-8")
          with psycopg.connect("postgresql://user:password@localhost:5432/dbname", autocommit=True) as conn:
              with conn.cursor() as cursor:
                  cursor.execute(sql)
          PY
      - name: Run integration tests
        run: uv run pytest tests/integration