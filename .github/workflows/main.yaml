name: Dailymotion Actions
on: [ push, pull_request ]


jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: chartboost/ruff-action@v1
        name: Ruff check backend
        with:
          src: './backend'
      - uses: chartboost/ruff-action@v1
        name: Ruff format backend
        with:
          src: './backend'
          args: 'format'
      - uses: actions/setup-node@v4
        with:
          node-version: '21'
      - name: Install frontend dependencies
        run: cd frontend && npm install
      - name: Lint frontend
        run: cd frontend; npm run lint && npm run format
  
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend tests dependencies and run tests
        run: cd backend && pip install -r requirements/test.txt && pytest
      - uses: actions/setup-node@v4
        with:
          node-version: '21'
      - name: Install frontend dependencies and run tests
        run: cd frontend && npm install && npm run test:unit