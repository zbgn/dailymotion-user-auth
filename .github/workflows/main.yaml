name: Dailymotion Actions
on: [ push, pull_request ]


jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: chartboost/ruff-action@v1
        name: Ruff check backend
        with:
          src: '.'
      - uses: chartboost/ruff-action@v1
        name: Ruff format backend
        with:
          src: '.'
          args: 'format'
  
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend tests dependencies and run tests
        run: pip install -r requirements/test.txt && pytest