[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dailymotion-user-auth"
requires-python = ">= 3.12"
version = "2024.1.5"
authors = [
  { name="Zackary Beaugelin", email="zackary@zbgn.fr" },
]
dynamic = [
    "dependencies",
]

[project.urls]
Homepage = "https://github.com/zbgn/dailymotion-user-auth"
Issues = "https://github.com/zbgn/dailymotion-user-auth/issues"

[project.scripts]
api = "app.api:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requierments/main-no-hash.txt"]}

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

line-length = 120
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "ISC001", "D203", "D212"]

fixable = ["ALL"]
unfixable = []

dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"**/test*/**.py" = [
  "S101",  # Use of assert detected
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"